<div class="post">
  <span class="post-title">
    <a href="{{ post.url | relative_url }}">{{ include.title }}{% if include.meta contains "черновик" %} <span class="draft">({% if include.lang %}draft{% else %}черновик{% endif %})</span>{% endif %}</a>
  </span>
  <br>
  {% if include.date %}
  <span class="post-date-inline">{{ include.date | date: "%Y.%m.%d" }}</span>&nbsp;
  {% endif %}
  {% if include.tags %}
  <span class="post-tags-inline">
    {% include list-of-tags.html tags=include.tags %}
  </span>
  {% endif %}
</div>
